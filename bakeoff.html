<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>RECALL Bake-off</title>
<style>
:root{--bg:#0d1421;--panel:#151f30;--panel2:#1d2a3e;--line:#2a3a50;--text:#edf3fb;--muted:#9eacc0;--accent:#8b9cff;--green:#62d6a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0 20px}.brand{font-weight:850;letter-spacing:3px;font-size:20px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:24px}.side{display:flex;flex-direction:column;gap:6px}.nav,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 13px;border-radius:10px;text-align:left}.nav.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#101827;font-weight:750}.nav{display:flex;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:27px;font-weight:800;margin-top:7px}.small{font-size:12px;color:var(--muted)}h1{font-size:30px;letter-spacing:-.8px;margin:4px 0}h2{font-size:20px;margin:8px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:4px 9px;font-size:11px;color:var(--muted)}textarea,input,select{width:100%;background:#0d1726;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}textarea{min-height:130px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:auto;margin:3px 0;accent-color:var(--green)}.bar{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.timer{font-size:52px;font-weight:800;text-align:center;margin:20px}.hidden{display:none!important}.mobile{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;overflow:auto;gap:6px;margin-top:12px}.mobile button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.shell{padding:14px}h1{font-size:25px}}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;font-weight:600}tr:last-child td{border:0}
</style>
</head>
<body><div class="shell">
<header class="top">
  <div><div class="brand">RECALL<span style="color:var(--accent)">.</span></div><div class="small">Model bake-off tool</div></div>
</header>

<h1>RECALL Bake-off</h1>
<p class="muted">Compare how well each model scores PM interview answers. Run before finalising the order in your MODELS setting.</p>

<div class="card">
  <h2>Configuration</h2>
  <label class="small">Worker URL
    <input type="text" id="workerUrl" placeholder="https://recall-proxy.username.workers.dev">
  </label>
  <label class="small">Passcode
    <input type="password" id="passcode" placeholder="Enter your Worker passcode">
  </label>
  <label class="small">Model
    <select id="model">
      <option value="gemini-3.8-flash" selected>gemini-3.8-flash (Google · newest Flash)</option>
      <option value="gemini-3.6-flash">gemini-3.6-flash (Google · stable)</option>
      <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Google · fastest)</option>
      <option value="nvidia/nemotron-3.5-super-vl-120b-a12b">nvidia/nemotron-3.5-super-vl-120b-a12b (NVIDIA)</option>
      <option value="nvidia/nemotron-3-super-120b-a12b">nvidia/nemotron-3-super-120b-a12b (NVIDIA · research pick)</option>
      <option value="z-ai/glm-5.3-flash">z-ai/glm-5.3-flash (NVIDIA)</option>
      <option value="mistralai/mistral-large-4-1t-a52b">mistralai/mistral-large-4-1t-a52b (NVIDIA · timed out)</option>
    </select>
  </label>
</div>

<div class="card">
  <h2>Sample Answers</h2>
  <label class="small">Answer 1 — Vague / weak
    <textarea id="answer1">Payment conversion dropped 15%. I would look at the data and find the problem and fix it.</textarea>
  </label>
  <label class="small">Answer 2 — Strong / structured
    <textarea id="answer2">Payment conversion fell from 72% to 59% in two weeks. I would segment by platform, payment method, and user cohort; check for latency spikes on the payments API; and rule out UX regressions from the recent deploy before proposing solutions.</textarea>
  </label>
  <label class="small">Answer 3 — Rambling / no structure
    <textarea id="answer3">So, like, I would first check everything and also talk to stakeholders and also look at the data and then maybe do some user interviews and then probably fix it after figuring out the main thing that's wrong.</textarea>
  </label>
  <button class="btn primary" id="runBtn">Run bake-off</button>
  <p id="status" class="small muted"></p>
</div>

<table id="results" class="hidden">
  <thead>
    <tr>
      <th>Answer</th>
      <th>Model</th>
      <th>JSON Valid</th>
      <th>Score</th>
      <th>Fix</th>
      <th>Latency ms</th>
    </tr>
  </thead>
  <tbody id="resultsBody"></tbody>
</table>

</div>
<script src="config.js"></script>
<script>
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Pre-fill from config.js and localStorage
(function(){
  document.getElementById('workerUrl').value =
    (typeof CONFIG !== 'undefined' ? CONFIG.workerUrl : '') || '';
  document.getElementById('passcode').value =
    localStorage.getItem('passcode') || '';
})();

async function runBakeoff() {
  const workerUrl = document.getElementById('workerUrl').value.trim();
  const passcode = document.getElementById('passcode').value.trim();
  const model = document.getElementById('model').value;
  const answers = [
    document.getElementById('answer1').value,
    document.getElementById('answer2').value,
    document.getElementById('answer3').value,
  ];

  const status = document.getElementById('status');
  const resultsTable = document.getElementById('results');
  const resultsBody = document.getElementById('resultsBody');

  const started = Date.now();
  const tick = setInterval(() => { status.textContent = 'Running... ' + Math.round((Date.now() - started) / 1000) + 's'; }, 1000);
  status.textContent = 'Running... 0s';
  resultsTable.classList.add('hidden');
  resultsBody.innerHTML = '';

  try {
    const resp = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task: 'bakeoff', passcode, model, answers }),
      signal: AbortSignal.timeout(90000), // Worker gives up per answer at ~55s
    });
    clearInterval(tick);

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      status.textContent = 'Error ' + resp.status + ': ' + (err.error || resp.statusText);
      return;
    }

    const data = await resp.json();
    const results = data.results || [];

    results.forEach(r => {
      const fb = r.feedback || {};
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.answer_index + 1}</td>
        <td><span class="small">${esc(r.model || model)}</span></td>
        <td>${r.valid_json ? '&#10003;' : '&#10007;'}</td>
        <td>${esc(fb.score != null ? fb.score : (r.error || '—'))}</td>
        <td>${esc(fb.fix || '—')}</td>
        <td>${esc(r.latency_ms)}</td>
      `;
      resultsBody.appendChild(tr);
    });

    resultsTable.classList.remove('hidden');
    status.textContent = 'Done. ' + results.length + ' results.';
  } catch (e) {
    clearInterval(tick);
    status.textContent = e.name === 'TimeoutError'
      ? 'No reply after 90s — this model is too slow right now. Try the next model.'
      : 'Network error: ' + e.message;
  }
}

document.getElementById('runBtn').addEventListener('click', runBakeoff);
</script>
</body></html>
