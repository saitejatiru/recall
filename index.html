<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>RECALL — 30-Day Training</title>
<style>
:root{--bg:#0d1421;--panel:#151f30;--panel2:#1d2a3e;--line:#2a3a50;--text:#edf3fb;--muted:#9eacc0;--accent:#8b9cff;--green:#62d6a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0 20px}.brand{font-weight:850;letter-spacing:3px;font-size:20px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;margin-top:24px}.side{display:flex;flex-direction:column;gap:6px}.nav,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 13px;border-radius:10px;text-align:left}.nav.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#101827;font-weight:750}.nav{display:flex;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:27px;font-weight:800;margin-top:7px}.small{font-size:12px;color:var(--muted)}h1{font-size:30px;letter-spacing:-.8px;margin:4px 0}h2{font-size:20px;margin:8px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:4px 9px;font-size:11px;color:var(--muted)}textarea,input{width:100%;background:#0d1726;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}textarea{min-height:130px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:auto;margin:3px 0;accent-color:var(--green)}.bar{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.timer{font-size:52px;font-weight:800;text-align:center;margin:20px}.hidden{display:none!important}.mobile{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;overflow:auto;gap:6px;margin-top:12px}.mobile button{white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}.shell{padding:14px}h1{font-size:25px}}
</style>
</head>
<body><div class="shell">
<header class="top"><div><div class="brand">RECALL<span style="color:var(--accent)">.</span></div><div class="small">30-day cognitive & communication training</div></div><div class="small" id="dayLabel">DAY 01 / 30</div></header>
<div class="mobile" id="mobile"></div>
<div class="layout"><aside class="side" id="side"></aside><main id="app" aria-live="polite"></main></div>
</div>
<script>
const sections=[['home','▦','Dashboard'],['memory','◈','Memory Gym'],['speak','◉','Speaking Studio'],['think','✳','Thinking Lab'],['interview','▤','Interview Arena'],['focus','◷','Focus & Detox'],['progress','↗','Progress']];
const days=[
['Foundation','Explain a familiar topic in your own words','What makes a product successful?'],
['Foundation','Recall three things you learned yesterday','What is the difference between output and outcome?'],
['Foundation','Explain a concept to a beginner','Why is customer retention important?'],
['Foundation','Summarise a short reading without notes','How do you measure customer satisfaction?'],
['Foundation','Describe a recent decision and its reasoning','What makes a good product metric?'],
['Foundation','Speak for 90 seconds without stopping','How would you improve a checkout experience?'],
['Review','Review your three biggest communication gaps','What did you learn this week?'],
['Projects','Explain a project you personally worked on','What was the original problem?'],
['Projects','Recall project decisions without looking at documents','What alternatives did you consider?'],
['Projects','Explain a measurable business outcome','How did you measure success?'],
['Projects','Defend a difficult product decision','Why did you choose this solution?'],
['Projects','Explain one failure and what changed','What would you do differently?'],
['Projects','Give a two-minute project walkthrough','How did you influence stakeholders?'],
['Review','Review your strongest project stories','Which story demonstrates your best product thinking?'],
['Thinking','Analyse a business problem independently','Payment completion falls from 72% to 59%. Diagnose it.'],
['Thinking','Identify assumptions and missing information','A new feature has low adoption. What would you investigate?'],
['Thinking','Prioritise competing opportunities','You have three features and limited engineering capacity. Decide.'],
['Thinking','Explain a trade-off','Would you prioritise growth or retention?'],
['Thinking','Propose an experiment','How would you test a new onboarding flow?'],
['Thinking','Think aloud while solving a problem','A product has high sign-ups but low activation. Why?'],
['Review','Review your hardest problem-solving exercise','What assumption did you change?'],
['Interview','Answer a behavioural question using a real example','Tell me about a time you disagreed with a stakeholder.'],
['Interview','Answer a product strategy question','How would you build a strategy for a new fintech product?'],
['Interview','Answer a metrics question','Payment conversion dropped by 15%. What would you do?'],
['Interview','Answer a prioritisation question','How would you prioritise a roadmap?'],
['Interview','Answer an execution question','Engineering says a launch will be delayed. How do you respond?'],
['Interview','Complete a 10-minute mock interview','Walk me through your most impactful project.'],
['Review','Review your weakest interview responses','What question made you freeze?'],
['Simulation','Conduct a stakeholder update','Explain a product recommendation in three minutes.'],
['Simulation','Final interview simulation','Why should we hire you as a Product Manager?']
];
const questions=['Why should a company invest in customer retention?','Explain a project you are proud of.','What would you do if your manager disagreed with your recommendation?','How would you improve a fintech payment experience?','Explain why a product feature failed.','What makes you a good Product Manager?','How would you convince a stakeholder to change priorities?','Explain a technical concept to a non-technical person.','What would you do if you did not know the answer to a stakeholder question?'];
const cases=[['Payment conversion is falling','A fintech product sees payment completion fall from 72% to 59% over two weeks. Diagnose the problem before proposing solutions.','Segment by platform, payment method, user cohort and funnel step. Check technical failures, latency, UX changes and external payment-provider issues. Validate the cause before changing the product.'],['Low feature adoption','A new rewards feature has 100,000 eligible users but only 8% use it. Diagnose the problem.','Check awareness, discoverability, eligibility, value proposition, onboarding, usability and repeat engagement. Interview users and analyse behaviour.'],['Prioritisation conflict','Engineering wants reliability improvements, Sales wants three features and leadership wants growth. Capacity allows one initiative. Decide.','Assess customer impact, strategic fit, revenue, risk, effort and dependencies. Make assumptions explicit and align stakeholders on a decision framework.'],['Poor onboarding','Only 35% of new users complete onboarding. What would you investigate?','Map each step, identify abandonment points, segment cohorts, inspect friction and test improvements. Track completion and downstream activation.']];
const interview=[['Product sense','How would you improve a digital payments app?'],['Metrics','Payment conversion dropped by 15% overnight. How would you investigate?'],['Strategy','How would you create a product strategy for a new fintech product?'],['Prioritisation','How do you prioritise features when every stakeholder says their request is urgent?'],['Execution','Tell me about a time you took a product from idea to launch.'],['Leadership','Tell me about a time you disagreed with a senior stakeholder.'],['Failure','Tell me about a product decision that did not work.'],['Analytics','How would you measure the success of a new feature?']];
let data={};try{data=JSON.parse(localStorage.getItem('recallData')||'{}')}catch(e){}
let page='home',timer=null;
const $=s=>document.querySelector(s),today=()=>new Date().toLocaleDateString('en-CA'),day=()=>Math.max(1,Math.min(30,+data.day||1)),key=x=>x+'-'+today(),save=()=>{localStorage.setItem('recallData',JSON.stringify(data));$('#dayLabel').textContent=`DAY ${String(day()).padStart(2,'0')} / 30`},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){let make=(x)=>`<button class="nav ${page===x[0]?'active':''}" data-page="${x[0]}">${x[1]} ${x[2]}</button>`;$('#side').innerHTML=sections.map(make).join('');$('#mobile').innerHTML=sections.slice(0,5).map(make).join('')}
function head(t,s){return `<div class="small">RECALL / ${t.toUpperCase()}</div><h1>${t}</h1><p class="muted">${s}</p>`}
function card(t,b){return `<section class="card"><h2>${t}</h2>${b}</section>`}
function home(){let done=data['tasks-'+today()]||[],d=days[day()-1];return head('Your training dashboard','Build the ability to remember, reason and communicate without depending on prompts.')+`<div class="grid">${[['PROGRAMME DAY',day()+'/30'],['TODAY’S PROGRESS',Math.round(done.length/5*100)+'%'],['TASKS COMPLETED',done.length+'/5'],['SAVED ENTRIES',Object.keys(data).filter(k=>k.includes('-')).length]].map(x=>`<div class="card"><div class="small">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div>`+card('Today’s focus',`<span class="tag">WEEK ${Math.ceil(day()/7)} · ${d[0]}</span><h2>${d[1]}</h2><p>${d[2]}</p><button class="btn primary" data-page="memory">Start training →</button>`)+card('Daily routine',`<div class="bar"><span style="width:${done.length*20}%"></span></div>`+['Recall yesterday’s learning without notes · 10 min','Explain one topic aloud · 10 min','Answer five unexpected questions · 10 min','Solve one product problem · 10 min','Write a short reflection · 5 min'].map((x,i)=>`<label class="task"><input type="checkbox" data-task="${i}" ${done.includes(i)?'checked':''}>${x}</label>`).join(''))+card('30-day roadmap',`<div class="row">${days.map((x,i)=>`<button class="btn ${day()===i+1?'primary':''}" data-day="${i+1}">${i+1}</button>`).join('')}</div>`)}
function memory(){let prompts=['What are three important things you learned yesterday?','Explain the difference between a product metric and a business outcome.','What is one decision you made recently and why?','Describe a concept you can explain without notes.'];return head('Memory Gym','Practise retrieval. First attempt must be without notes, Google or AI.')+card('Daily recall challenge',`<span class="tag">10 MINUTES</span><h2>${prompts[(day()-1)%prompts.length]}</h2><p class="muted">Write everything you can remember before checking anything.</p><textarea id="answer" placeholder="Write what you remember...">${esc(data[key('recall')])}</textarea><button class="btn primary" id="saveRecall">Save my recall</button><p id="status" class="small"></p>`)+card('Self-check',`<ul><li>Did I recall the main idea?</li><li>Could I explain it in my own words?</li><li>Did I give a relevant example?</li><li>What did I forget or confuse?</li></ul>`)}
function speak(){return head('Speaking Studio','Organise your thoughts while speaking. Pauses are allowed.')+card('90-second speaking challenge',`<span class="tag">THINK 30 SEC · SPEAK 90 SEC</span><h2 id="question">${questions[(day()-1)%questions.length]}</h2><div class="timer" id="clock">01:30</div><div class="row"><button class="btn primary" id="start">Start speaking</button><button class="btn" id="reset">Reset</button><button class="btn" id="newQ">New question</button></div><textarea id="answer" placeholder="After speaking, note what you said well and what you missed...">${esc(data[key('speak')])}</textarea><button class="btn primary" id="saveSpeak">Save reflection</button>`)+card('PREP framework',`<b>P — Point:</b> State your answer.<br><b>R — Reason:</b> Explain why.<br><b>E — Example:</b> Give evidence or experience.<br><b>P — Point:</b> Conclude clearly.`)+card('Professional phrases',`“Let me think about that for a moment.”<br>“There are two aspects I would consider.”<br>“My recommendation would be…”<br>“I don't have that information right now, but here is how I would investigate it.”`)}
function think(){let c=cases[(day()-1)%cases.length];return head('Thinking Lab','Solve real business problems before asking AI for the answer.')+card('Independent case study',`<span class="tag">15 MINUTES</span><h2>${c[0]}</h2><p>${c[1]}</p><textarea id="answer" placeholder="1. Define the problem and objective.&#10;2. What information do you need?&#10;3. What are your hypotheses?&#10;4. What would you prioritise?&#10;5. How would you measure success?">${esc(data[key('case')])}</textarea><button class="btn primary" id="saveCase">Save analysis</button> <button class="btn" id="reveal">Show suggested reasoning</button><p id="solution" class="hidden">${c[2]}</p>`)+card('Thinking checklist',`<ul><li>Did I define the problem before jumping to a solution?</li><li>Did I separate facts from assumptions?</li><li>Did I consider alternative explanations?</li><li>Did I identify trade-offs?</li><li>Did I define a measurable outcome?</li></ul>`)}
function interviewPage(){let q=interview[(day()-1)%interview.length];return head('Interview Arena','Defend your thinking without memorised scripts.')+card('Question of the day',`<span class="tag">${q[0]}</span><h2>${q[1]}</h2><p class="muted">Prepare 30 seconds · Answer for 2 minutes</p><div class="timer" id="clock">02:00</div><button class="btn primary" id="startInterview">Start 2-minute timer</button><textarea id="answer" placeholder="After answering aloud, capture your main points...">${esc(data[key('interview')])}</textarea><button class="btn primary" id="saveInterview">Save response</button>`)+card('Question bank',interview.map((q,i)=>`<details><summary>${i+1}. ${q[0]}</summary><p>${q[1]}</p></details>`).join(''))+card('Prepare eight project stories',`Payment conversion improvement · AI document pipeline · Product execution · Customer satisfaction · Refund reduction · Stakeholder disagreement · Initiative launch · A failure and what you learned.`)}
function focus(){return head('Focus & Screen Detox','Regain control over when and why you consume content.')+card('Today’s screen habits',`<div class="grid" style="grid-template-columns:1fr 1fr"><label class="small">Short-form minutes<input id="short" type="number" min="0" value="${esc(data[key('short')])}"></label><label class="small">Long-form minutes<input id="long" type="number" min="0" value="${esc(data[key('long')])}"></label></div><button class="btn primary" id="saveScreen">Save usage</button>`)+card('Screen-free boundaries',`<div id="boundaries">${['First hour after waking: no videos','Brushing and bathing: no videos','Meals: eat without a screen','Last hour before sleep: no videos','Two scheduled educational content sessions','Phone away during deep work'].map((x,i)=>`<label class="task"><input type="checkbox" data-bound="${i}" ${(data[key('bounds')]||[]).includes(i)?'checked':''}>${x}</label>`).join('')}</div><p class="small">Tick only boundaries you actually maintained. Reduce gradually from your baseline.</p>`)+card('Distraction journal',`<textarea id="answer" placeholder="When did I feel the urge to watch? What triggered it? What did I do instead?">${esc(data[key('distraction')])}</textarea><button class="btn primary" id="saveDistraction">Save reflection</button>`)}
function progress(){let n=Object.keys(data).filter(k=>k.startsWith('tasks-')).reduce((a,k)=>a+(data[k]||[]).length,0);return head('Progress','Measure actions and your ability to communicate, not content consumed.')+card('Your programme',`<div class="grid"><div><div class="small">DAY</div><div class="stat">${day()}/30</div></div><div><div class="small">TASKS COMPLETED</div><div class="stat">${n}</div></div></div>`)+card('Daily reflection',`<textarea id="answer" placeholder="What was difficult today? What did you explain well? What will you improve tomorrow?">${esc(data[key('reflection')])}</textarea><button class="btn primary" id="saveReflection">Save reflection</button>`)+card('Backup',`<button class="btn primary" id="export">Download my data backup</button>`)}
function render(){nav();save();$('#app').innerHTML=({home,memory,speak,think,interview:interviewPage,focus,progress})[page]()}
function stop(){if(timer)clearInterval(timer);timer=null}
function runTimer(n){stop();let left=n;let target=$('#clock');const draw=()=>target.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');draw();timer=setInterval(()=>{left--;draw();if(left<=0)stop()},1000)}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;stop();render();return}let d=e.target.closest('[data-day]');if(d){data.day=+d.dataset.day;page='home';render();return}let id=e.target.id;if(id==='saveRecall'||id==='saveCase'||id==='saveSpeak'||id==='saveInterview'||id==='saveReflection'||id==='saveDistraction'){let k={saveRecall:'recall',saveCase:'case',saveSpeak:'speak',saveInterview:'interview',saveReflection:'reflection',saveDistraction:'distraction'}[id];data[key(k)]=$('#answer').value;save();$('#status')&&($('#status').textContent='Saved. Revisit this tomorrow.');return}if(id==='start')runTimer(90);if(id==='startInterview')runTimer(120);if(id==='reset'){stop();$('#clock').textContent='01:30'}if(id==='newQ')$('#question').textContent=questions[Math.floor(Math.random()*questions.length)];if(id==='reveal')$('#solution').classList.toggle('hidden');if(id==='saveScreen'){data[key('short')]=$('#short').value;data[key('long')]=$('#long').value;save();alert('Saved')}if(id==='export'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='recall-backup.json';a.click();URL.revokeObjectURL(u)}});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){let a=data['tasks-'+today()]||[],i=+e.target.dataset.task;data['tasks-'+today()]=e.target.checked?[...new Set([...a,i])]:a.filter(x=>x!==i);save();render()}if(e.target.dataset.bound!==undefined){let a=data[key('bounds')]||[],i=+e.target.dataset.bound;data[key('bounds')]=e.target.checked?[...new Set([...a,i])]:a.filter(x=>x!==i);save()}});
render();
</script></body></html>
