<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>RECALL — 30-Day Training</title>
<style>
:root{--bg:#0d1421;--panel:#151f30;--panel2:#1d2a3e;--line:#2a3a50;--text:#edf3fb;--muted:#9eacc0;--accent:#8b9cff;--green:#62d6a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0 20px}.brand{font-weight:850;letter-spacing:3px;font-size:20px}.muted{color:var(--muted)}.nav,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 13px;border-radius:10px;text-align:left}.nav.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#101827;font-weight:750}.nav{display:flex;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{font-size:27px;font-weight:800;margin-top:7px}.small{font-size:12px;color:var(--muted)}h1{font-size:30px;letter-spacing:-.8px;margin:4px 0}h2{font-size:20px;margin:8px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:4px 9px;font-size:11px;color:var(--muted)}textarea,input{width:100%;background:#0d1726;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}textarea{min-height:130px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:auto;margin:3px 0;accent-color:var(--green)}.bar{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.timer{font-size:52px;font-weight:800;text-align:center;margin:20px}.hidden{display:none!important}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.shell{padding:14px}h1{font-size:25px}.step-circle{width:28px;height:28px;font-size:12px}.step-label{display:none}.step.active .step-label{display:block}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:0;margin-bottom:24px}.step{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;flex:1}.step-circle{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;min-width:36px}.step-label{font-size:12px;color:var(--muted);white-space:nowrap}.step-line{flex:1;height:2px;background:var(--line);margin:0 4px;align-self:center;margin-bottom:20px}.step.active .step-circle{background:var(--accent);border-color:var(--accent);color:#101827}.step.complete .step-circle{background:var(--green);border-color:var(--green);color:#101827}
.day-grid{display:grid;grid-template-columns:repeat(5,24px);gap:4px}.day-dot{width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.thinking{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin-top:12px}
.orb{flex:none;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d5dbff,var(--accent));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);box-shadow:0 0 0 0 #8b9cff66}50%{transform:scale(1);box-shadow:0 0 0 14px #8b9cff00}}
.dots span{animation:blink 1.4s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.bar.think span{background:var(--accent);transition:width 1s linear}
@media(prefers-reduced-motion:reduce){.orb,.dots span{animation:none}}
</style>
</head>
<body><div class="shell">
<header class="top"><div><div class="brand">RECALL<span style="color:var(--accent)">.</span></div><div class="small">30-day cognitive &amp; communication training</div></div></header>
<div id="journey" aria-live="polite"></div>
<div id="thinking" class="thinking hidden" role="status" aria-live="polite">
  <div class="orb" aria-hidden="true"></div>
  <div style="flex:1;min-width:0">
    <div><b>Coach is thinking</b><span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="small" id="thinkMsg">Reading your answer…</div>
    <div class="bar think" style="margin-top:8px"><span id="thinkBar" style="width:0%"></span></div>
  </div>
  <div class="stat" id="thinkTime" style="margin:0;font-size:22px">0:00</div>
</div>
<div id="aiFeedback" class="hidden"></div>
</div>
<!-- passcode setup modal — shown when localStorage.passcode is unset -->
<div id="setupModal" style="display:none;position:fixed;inset:0;background:#0d142199;z-index:99;align-items:center;justify-content:center">
  <div class="card" style="max-width:360px;width:100%">
    <h2>First-time setup</h2>
    <p class="muted">Enter the passcode you will set in the Cloudflare Worker. It is stored only in this browser and sent only to your Worker.</p>
    <input type="password" id="passcodeInput" placeholder="Passcode">
    <button class="btn primary" id="savePasscode">Save &amp; continue</button>
  </div>
</div>
<script src="config.js"></script>
<script src="content.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
<!-- inline script removed in Plan 02-01; all logic moved to external scripts -->
</body></html>
